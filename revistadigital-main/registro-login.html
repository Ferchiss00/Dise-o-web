<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Registro y Login</title>
</head>
<body>
    <header id="home">
        <h1>Revista Digital</h1>

        <nav>
            <ul>
                <li><a href="/index.html#home">Home</a></li>
                <li><a href="/index.html#news">News</a></li>
                <li><a href="/index.html#sports">Sports</a></li>
                <li><a href="/index.html#tech">Technologies</a></li>
                <li><a href="/registro-login.html">Registro y Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="formulario-contenedor">
            <form class="formulario">
                <h3>DATOS PERSONALES</h1>
                <div class="formulario-control">
                    <span class="formulario-control-name">Documento de identificación</span>
                    <input type="text" class="formulario-campo">
                </div>
                <div class="formulario-control">
                    <span class="formulario-control-name">Nombre</span>
                    <input type="text" class="formulario-campo">
                </div>
                <div class="formulario-control">
                    <span class="formulario-control-name">Dirección</span>
                    <input type="text" class="formulario-campo">
                </div>
                <div class="formulario-control">
                    <span class="formulario-control-name">País</span>
                    <input type="text" class="formulario-campo">
                </div>
                <div class="formulario-control">
                    <span class="formulario-control-name">E-Mail</span>
                    <input type="text" class="formulario-campo">
                </div>
            </form>
            <form class="formulario">
                <h3>DATOS LABORALES</h3>
                <div class="formulario-control">
                    <span class="formulario-control-name">Empresa</span>
                    <input type="text" class="formulario-campo">
                </div>
                <div class="formulario-control">
                    <span class="formulario-control-name">Sueldo ordinario</span>
                    <input type="text" class="formulario-campo">
                </div>
                <div class="formulario-control">
                    <span class="formulario-control-name">Bonificación</span>
                    <input type="text" class="formulario-campo">
                </div>
            </form>
            <div class="formulario-pie">
                <button class="formulario-enviar">Enviar Datos</button>
            </div>
        </section>
    </main>
</body>
</html>
